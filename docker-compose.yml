services:
  postgres:
    image: postgres:16-alpine
    container_name: lunaire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunaire
      POSTGRES_PASSWORD: lunaire
      POSTGRES_DB: lunaire
    ports:
      - "5432:5432"
    volumes:
      - lunaire_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunaire -d lunaire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lunaire_pg_data:
